<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CesiumSim</title>
    <!-- Cesium JS -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.135/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.135/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.14.0-beta3/css/bootstrap-select.min.css">
    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.14.0-beta3/js/bootstrap-select.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js" crossorigin="anonymous"></script>
    
    <script type="text/javascript" src="static/js/main.js"></script>  

    <style>
        body, html {
            margin: 0;
            height: 100%;
            background-color: #121212;
            color: white;
            font-family: 'Inter', Arial, sans-serif;
            overflow: hidden; /* Prevent scrolling on the body */
        }
        main.d-flex {
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        aside.sidebar {
            width: 280px;
            flex-shrink: 0; /* Prevent sidebar from shrinking */
            background-color: #1e1e1e;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        aside.sidebar p.fs-4 {
            margin-bottom: 0;
            text-align: center;
        }
        aside.sidebar hr {
            border-color: #444;
            margin: 1rem 0;
        }
        ul.nav-pills {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding-left: 0;
            list-style: none;
            margin: 0;
        }
        ul.nav-pills li {
            width: 100%;
        }
        label.form-label {
            font-weight: 600;
            display: block;
            margin-bottom: 0.25rem;
        }
        select.selectpicker, input.form-control, input.form-range, button.btn {
            width: 100%;
            box-sizing: border-box;
        }
        /* Style for bootstrap-select */
        .bootstrap-select .btn {
            background-color: #0d6efd !important;
            color: white !important;
            border: none;
        }
        .dropdown-menu {
            background-color: #343a40;
        }
        .dropdown-item {
            color: #f8f9fa;
        }
        .dropdown-item:hover {
            background-color: #495057;
            color: white;
        }

        button.btn {
            margin-top: 0.5rem;
        }
        /* Collapse card styling */
        .card.card-body.text-bg-dark {
            background-color: #2a2a2a;
            border-radius: 0.25rem;
            padding: 1rem;
            border: none;
        }
        /* Main content area */
        main > .content-area {
            flex-grow: 1;
            background-color: #121212;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        /* Tabs */
        .nav-pills .nav-link {
            color: #ddd;
        }
        .nav-pills .nav-link.active {
            background-color: #007bff;
            color: white;
        }
        /* Canvas styling */
        #cesiumContainer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%;
            height: 100%;
        }
        #cesiumContainerOverlay,
        #screenshot_canvas,
        #temp_canvas {
            pointer-events: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            z-index: 9;
        }
        #screenshot_canvas,
        #temp_canvas {
            visibility: hidden;
        }
    </style>
</head>




<body>
  <style>
    body, html {
      margin: 0;
      height: 100%;
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
    }

    main.d-flex {
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    aside.sidebar {
      width: 280px;
      background-color: #1e1e1e;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    aside.sidebar p.fs-4 {
      margin-bottom: 0;
      text-align: center;
    }

    aside.sidebar hr {
      border-color: #444;
      margin: 1rem 0;
    }

    ul.nav-pills {
      display: flex;
      flex-direction: column;
      gap: 1rem; /* replaces &nbsp; spacing */
      padding-left: 0;
      list-style: none;
      margin: 0;
    }

    ul.nav-pills li {
      width: 100%;
    }

    label.form-label {
      font-weight: 600;
      display: block;
      margin-bottom: 0.25rem;
    }

    select.selectpicker, input.form-control, input.form-range, button.btn {
      width: 100%;
      box-sizing: border-box;
    }

    button.btn {
      margin-top: 0.5rem;
    }

    /* Collapse card styling */
    .card.card-body.text-bg-dark {
      background-color: #2a2a2a;
      border-radius: 0.25rem;
      padding: 1rem;
    }

    /* Sidebar buttons full width */
    aside.sidebar button.btn {
      width: 100%;
    }

    /* Main content area */
    main > .content-area {
      flex-grow: 1;
      background-color: #121212;
      overflow: auto;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Tabs */
    .nav-pills .nav-link {
      color: #ddd;
    }
    .nav-pills .nav-link.active {
      background-color: #007bff;
      color: white;
    }

    /* Canvas styling */
    #cesiumContainer {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
    }
    #cesiumContainerOverlay,
    #screenshot_canvas,
    #temp_canvas {
      pointer-events: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      z-index: 9;
    }
    #screenshot_canvas,
    #temp_canvas {
      visibility: hidden;
    }
  </style>

  <main class="d-flex flex-nowrap">

    <main class="content-area">
      <ul class="nav nav-pills mb-3 navbar-dark bg-dark border-bottom" id="pills-tab" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="pills-camera-tab" data-bs-toggle="pill" data-bs-target="#pills-camera" type="button" role="tab" aria-controls="pills-camera" aria-selected="true">
            LARD - CesiumSim
          </button>
        </li>
      </ul>

      <div class="tab-content flex-grow-1" id="pills-tabContent">
        <div class="tab-pane fade show active" id="pills-camera" role="tabpanel" aria-labelledby="pills-camera-tab" tabindex="0" style="position:relative; flex-grow:1;">
          <div id="cesiumContainer"></div>
          <canvas id="cesiumContainerOverlay"></canvas>
        </div>
      </div>
    </main>
  </main>
</body>




</html>
